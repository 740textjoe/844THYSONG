<!doctype html>
<!-- 844.THY.SONG player v0.16.1: v0.16 + CTA line break for mobile screenshot clarity -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071525">
  <title>844.THY.SONG</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --navy: #071525;
      --navy-2: #0b1d31;
      --panel: #0d2137;
      --cream: #fff3d2;
      --gold: #e8bd61;
      --gold-soft: #c99b45;
      --text: #f8f5ec;
      --muted: rgba(248,245,236,0.70);
      --line: rgba(232,189,97,0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 190px;
      background:
        radial-gradient(circle at top, rgba(33, 78, 122, 0.30), transparent 42%),
        linear-gradient(180deg, var(--navy-2) 0%, #030a12 100%);
      color: var(--text);
    }

    main {
      width: min(620px, 100%);
      margin: 0 auto;
    }

    .card {
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      padding: 26px;
      background: rgba(7, 21, 37, 0.84);
      box-shadow: 0 24px 80px rgba(0,0,0,0.34);
      backdrop-filter: blur(12px);
    }

    .brand {
      margin: 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.20em;
      text-align: center;
      text-transform: uppercase;
    }

    .brand .tm {
      margin-left: 0.12em;
      font-size: 0.64em;
      vertical-align: super;
      letter-spacing: 0;
    }

    .brand-cta {
      margin: 8px 0 24px;
      color: rgba(248,245,236,0.68);
      font-size: 0.82rem;
      line-height: 1.4;
      text-align: center;
    }

    .brand-cta .number {
      color: rgba(232,189,97,0.92);
      font-weight: 700;
      white-space: nowrap;
    }

    h1 {
      margin: 0;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 11vw, 4.3rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.035em;
      text-align: center;
    }

    .meta {
      margin: 20px 0 26px;
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.35;
      text-align: center;
    }

    .meta strong {
      color: var(--text);
      font-weight: 650;
    }

    .lyrics-card {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px 18px 22px;
      background: rgba(13, 33, 55, 0.74);
    }

    .lyrics-title {
      margin: 0 0 18px;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
      font-weight: 600;
    }

    .lyrics-text {
      font-size: 1rem;
      line-height: 1.64;
      color: rgba(248,245,236,0.93);
      overflow-wrap: anywhere;
    }

    .lyric-heading {
      margin-top: 22px;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .lyric-heading:first-child {
      margin-top: 0;
    }

    .lyric-line {
      min-height: 1.64em;
    }

    .lyric-spacer {
      height: 0.72em;
    }

    .download-row {
      margin-top: 16px;
    }

    .button {
      appearance: none;
      display: block;
      width: 100%;
      border: 1px solid rgba(232,189,97,0.60);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--gold);
      background: transparent;
      font: inherit;
      font-weight: 750;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .footer {
      margin: 24px 0 0;
      color: rgba(248,245,236,0.50);
      font-size: 0.78rem;
      line-height: 1.55;
      text-align: center;
    }

    .footer .legal-brand {
      color: rgba(232,189,97,0.72);
    }

    #status {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
      text-align: center;
    }

    .player-dock {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: min(620px, calc(100% - 24px));
      border: 1px solid rgba(232,189,97,0.62);
      border-radius: 20px;
      padding: 15px 18px 13px;
      background: linear-gradient(180deg, #fff1c9 0%, #efd18b 100%);
      color: #071525;
      box-shadow: 0 18px 55px rgba(0,0,0,0.42);
    }

    .play-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .play-button {
      appearance: none;
      flex: 0 0 auto;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 50%;
      background: #071525;
      color: var(--cream);
      font: inherit;
      font-size: 1.35rem;
      font-weight: 900;
      cursor: pointer;
    }

    .play-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .play-label {
      border: 0;
      padding: 0;
      background: transparent;
      color: #071525;
      font: inherit;
      font-size: clamp(1.15rem, 5vw, 1.55rem);
      font-weight: 900;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-align: left;
    }

    .play-label:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .progress-wrap {
      margin-top: 11px;
    }

    .progress {
      width: 100%;
      accent-color: #9b7027;
      cursor: pointer;
    }

    .progress:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .times {
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
      color: rgba(7,21,37,0.78);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    audio {
      display: none;
    }

    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      body {
        padding: 14px 10px 182px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 20px;
      }

      .player-dock {
        bottom: 8px;
        width: calc(100% - 16px);
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" id="loading">
      <p class="brand">844.THY.SONG<span class="tm">™</span></p>
      <p class="brand-cta">
        Create your own Scripture song<br>
        Text <span class="number">844-849-7664</span>
      </p>
      <h1>Your song</h1>
      <p id="status">Loading your Scripture song…</p>
    </section>

    <section class="card" id="song" hidden>
      <p class="brand">844.THY.SONG<span class="tm">™</span></p>
      <p class="brand-cta">
        Create your own Scripture song<br>
        Text <span class="number">844-849-7664</span>
      </p>

      <h1 id="title">Your Scripture Song</h1>
      <div class="meta" id="meta"></div>

      <section class="lyrics-card" aria-labelledby="lyricsHeading">
        <h2 class="lyrics-title" id="lyricsHeading">Lyrics</h2>
        <div class="lyrics-text" id="lyricsText"></div>
      </section>

      <div class="download-row">
        <a class="button" id="download" href="#">Download MP3</a>
      </div>

      <p class="footer">
        <span class="legal-brand">844.THY.SONG™</span><br>
        © 2026 740-TEXT-JOE, LLC. All rights reserved.
      </p>
    </section>
  </main>

  <audio id="audio" preload="metadata" playsinline></audio>

  <section class="player-dock" id="playerDock" hidden aria-label="Song player">
    <div class="play-row">
      <button class="play-button" id="heroPlay" type="button" disabled aria-label="Play your song">
        ▶
      </button>
      <button class="play-label" id="heroLabel" type="button" disabled>
        PLAY SONG
      </button>
    </div>

    <div class="progress-wrap">
      <input
        class="progress"
        id="progress"
        type="range"
        min="0"
        max="1000"
        value="0"
        step="1"
        disabled
        aria-label="Song position"
      >
      <div class="times">
        <span id="elapsed">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>
  </section>

  <script>
    const SONG_INFO_ENDPOINT =
      "https://frkkfdshtqxbkzyrhdcr.supabase.co/functions/v1/thysong-song-info";

    const loading = document.getElementById("loading");
    const songSection = document.getElementById("song");
    const status = document.getElementById("status");
    const title = document.getElementById("title");
    const meta = document.getElementById("meta");
    const lyricsText = document.getElementById("lyricsText");
    const audio = document.getElementById("audio");
    const playerDock = document.getElementById("playerDock");
    const heroPlay = document.getElementById("heroPlay");
    const heroLabel = document.getElementById("heroLabel");
    const progress = document.getElementById("progress");
    const elapsed = document.getElementById("elapsed");
    const duration = document.getElementById("duration");
    const download = document.getElementById("download");

    function getShareCode() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      const fromPath = parts.length >= 2 && parts[0].toLowerCase() === "s"
        ? parts[1]
        : "";
      const fromQuery = new URLSearchParams(window.location.search).get("code") || "";
      return (fromPath || fromQuery).trim().toUpperCase();
    }

    function scriptureDisplayInfo(translation) {
      const code = String(translation || "").trim().toUpperCase();

      if (code === "OEB") {
        return { scripture: "Bible", version: "Open English Bible (OEB)" };
      }
      if (code === "BSB") {
        return { scripture: "Bible", version: "Berean Standard Bible (BSB)" };
      }
      if (code === "KJV") {
        return { scripture: "Bible", version: "King James Version (KJV)" };
      }
      if (code === "BOM1920") {
        return { scripture: "Book of Mormon", version: "1920 LDS Edition" };
      }
      return { scripture: "Scripture", version: code || "Unknown version" };
    }

    function setMeta(translation, style) {
      const display = scriptureDisplayInfo(translation);
      meta.replaceChildren();

      const scripture = document.createElement("div");
      scripture.innerHTML = `<strong>${display.scripture}</strong>`;

      const version = document.createElement("div");
      version.textContent = display.version;

      const sound = document.createElement("div");
      sound.textContent = style || "Song";

      meta.append(scripture, version, sound);
    }

    function renderLyrics(arrangedLyrics) {
      const text = String(arrangedLyrics || "").trim();
      lyricsText.replaceChildren();

      if (!text) {
        const missing = document.createElement("div");
        missing.className = "lyric-line";
        missing.textContent = "Lyrics are not available for this song.";
        lyricsText.appendChild(missing);
        return;
      }

      for (const rawLine of text.replace(/\r\n?/g, "\n").split("\n")) {
        const line = rawLine.trimEnd();

        if (!line.trim()) {
          const spacer = document.createElement("div");
          spacer.className = "lyric-spacer";
          lyricsText.appendChild(spacer);
          continue;
        }

        const element = document.createElement("div");
        if (/^\[[^\]]+\]$/.test(line.trim())) {
          element.className = "lyric-heading";
        } else {
          element.className = "lyric-line";
        }
        element.textContent = line;
        lyricsText.appendChild(element);
      }
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const whole = Math.floor(seconds);
      const minutes = Math.floor(whole / 60);
      const secs = whole % 60;
      return `${minutes}:${String(secs).padStart(2, "0")}`;
    }

    function updatePlayState() {
      const isPlaying = !audio.paused && !audio.ended;
      heroPlay.textContent = isPlaying ? "❚❚" : "▶";
      heroLabel.textContent = isPlaying ? "PAUSE" : "PLAY SONG";
      heroPlay.setAttribute("aria-label", isPlaying ? "Pause your song" : "Play your song");
    }

    function updateProgress() {
      const total = Number(audio.duration);
      const current = Number(audio.currentTime);

      elapsed.textContent = formatTime(current);
      duration.textContent = formatTime(total);

      if (Number.isFinite(total) && total > 0) {
        progress.value = String(Math.round((current / total) * 1000));
      } else {
        progress.value = "0";
      }
    }

    async function togglePlayback() {
      try {
        if (audio.paused || audio.ended) {
          await audio.play();
        } else {
          audio.pause();
        }
      } catch (error) {
        console.error(error);
      } finally {
        updatePlayState();
      }
    }

    async function attemptAutoplay() {
      try {
        await audio.play();
      } catch (error) {
        console.info("Autoplay was blocked; waiting for user tap.", error?.name || error);
      } finally {
        updatePlayState();
      }
    }

    async function loadSong() {
      const code = getShareCode();

      if (!code) {
        status.textContent = "This song link is incomplete.";
        return;
      }

      try {
        const response = await fetch(
          `${SONG_INFO_ENDPOINT}?code=${encodeURIComponent(code)}`,
          { cache: "no-store" }
        );

        const data = await response.json();

        if (!response.ok || !data?.ok || !data?.song) {
          throw new Error(data?.error || "Song not found.");
        }

        const s = data.song;
        const passage = s.passage || "Your Scripture Song";
        const style = s.style || "Song";
        const translation = s.translation || "BSB";

        document.title = `${passage} | 844.THY.SONG`;
        title.textContent = passage;
        setMeta(translation, style);
        renderLyrics(s.arranged_lyrics);

        audio.src = s.play_url;
        audio.load();

        download.href = s.download_url;
        download.setAttribute("download", "");

        heroPlay.disabled = false;
        heroLabel.disabled = false;
        progress.disabled = false;

        loading.hidden = true;
        songSection.hidden = false;
        playerDock.hidden = false;

        await attemptAutoplay();
      } catch (error) {
        console.error(error);
        status.textContent = error?.message || "Could not load this song right now.";
      }
    }

    heroPlay.addEventListener("click", togglePlayback);
    heroLabel.addEventListener("click", togglePlayback);

    progress.addEventListener("input", () => {
      const total = Number(audio.duration);
      if (!Number.isFinite(total) || total <= 0) return;
      audio.currentTime = (Number(progress.value) / 1000) * total;
      updateProgress();
    });

    audio.addEventListener("loadedmetadata", updateProgress);
    audio.addEventListener("durationchange", updateProgress);
    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("play", updatePlayState);
    audio.addEventListener("pause", updatePlayState);
    audio.addEventListener("ended", () => {
      updatePlayState();
      updateProgress();
    });

    loadSong();
  </script>
</body>
</html>
